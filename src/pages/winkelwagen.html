<main id="cart-app" style="max-width: 1340px; margin: 0 auto; padding: clamp(26px, 4vw, 48px) clamp(20px, 4vw, 56px) clamp(52px, 7vw, 100px);">
  <h1 style="margin: 0 0 clamp(24px, 3vw, 40px); font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.08;">Winkelwagen</h1>

  <div id="cart-empty" hidden style="display: flex; flex-direction: column; gap: 18px; align-items: flex-start; border-top: 1px solid rgba(52,48,42,0.16); padding-top: 30px;">
    <span style="font-size: 15px; color: #554E45;">Je winkelwagen is nog leeg.</span>
    <a href="shop.html" class="btn-tan" style="background: #A89684; color: #FFFDF9; padding: 14px 28px; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;">Bekijk de hoezen</a>
  </div>

  <div id="cart-filled" hidden style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: clamp(24px, 3vw, 52px); align-items: start;">
    <div style="display: flex; flex-direction: column;">
      <div id="cart-items"></div>
      <div style="border-top: 1px solid rgba(52,48,42,0.16); padding-top: 20px;">
        <a href="shop.html" class="link-underline">Verder winkelen</a>
      </div>
    </div>
    <div style="background: #FFFDF9; border: 1px solid rgba(52,48,42,0.16); padding: clamp(20px, 2.4vw, 28px); display: flex; flex-direction: column; gap: 14px;">
      <span style="font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #8B7B64;">Overzicht</span>
      <div style="display: flex; justify-content: space-between; font-size: 14px;"><span>Subtotaal</span><span id="cart-sub">€0,00</span></div>
      <div id="cart-korting-row" hidden style="display: flex; justify-content: space-between; font-size: 14px; color: #6E7A5E;"><span>Korting</span><span id="cart-korting">€0,00</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px;"><span>Verzending</span><span id="cart-verzend">Gratis</span></div>
      <span id="cart-bijna" hidden style="font-size: 12.5px; color: #7E6E58;">Nog <span id="cart-tekort">€0,00</span> tot gratis verzending.</span>
      <div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid rgba(52,48,42,0.16); padding-top: 14px;">
        <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 20px;">Totaal</span>
        <span id="cart-totaal" class="serif" style="font-size: 22px;">€0,00</span>
      </div>
      <span style="font-size: 11.5px; color: #8B7B64;">Waarvan <span id="cart-btw">€0,00</span> btw</span>
      <a href="afrekenen.html" class="btn-dark" style="display: block; text-align: center; border: none; padding: 15px 24px; font-size: 11.5px; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px;">Naar afrekenen</a>
      <span style="font-size: 12px; line-height: 1.6; color: #7E6E58;">Verzending naar huis of een pakketpunt, of afhalen in Hooglanderveen.</span>
    </div>
  </div>
</main>
